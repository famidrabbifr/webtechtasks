<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Create Account - Techflow Solutions</title>
</head>
<body style="margin:0; font-family: Arial, sans-serif; background-color:#f0f0f0; height:100vh;">

    <div style="background-color:#000000; color:white; text-align:center; padding:20px 0; font-size:20px;">
        Techflow Solutions
    </div>

    <div style="max-width:350px; margin:40px auto 70px; padding:15px;">
        <div style="background-color:white; padding:30px 40px; width:300px; margin:0 auto;">
            <h2 style="text-align:center; margin-bottom:20px;">Create Account</h2>
            <form>
                <label for="email" style="display:block; margin-bottom:5px; font-weight:bold;">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required
      style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; ">

                <label for="password" style="display:block; margin-bottom:5px; font-weight:bold;">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
         style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; ">

                <label for="confirm-password" style="display:block; margin-bottom:5px; font-weight:bold;">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required
         style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; ">

                <label for="gender" style="display:block; margin-bottom:5px; font-weight:bold;">Gender</label>
                <select id="gender" name="gender" required
                    style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; ">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <button type="submit"
                    style="width:100%; padding:10px; background-color:#00897b; color:white; border:none; ">
                    Register
                </button>
            </form>
        </div>
    </div>

    <div style="background-color:#000000; color:white; text-align:center; padding:15px 0; font-size:14px; position:fixed; bottom:40px; left:0; width:100%; z-index:999;">
        © 2026 Techflow Solutions. All rights reserved.
    </div>

    <div style="position:fixed; bottom:0; left:0; width:100%; background-color:#00897b; color:white; text-align:center; padding:10px 0; font-weight:bold; z-index:1000;">
        Current User: 1
    </div>

</body>
</html>
